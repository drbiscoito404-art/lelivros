name: Deploy LeLivros

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build public Supabase configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs');const url=process.env.SUPABASE_URL;const key=process.env.SUPABASE_ANON_KEY;if(Boolean(url)!==Boolean(key))throw new Error('Configure ambas as variáveis SUPABASE_URL e SUPABASE_ANON_KEY.');if(url&&key)fs.writeFileSync('config.js','window.LELIVROS_CONFIG = '+JSON.stringify({supabaseUrl:url,supabaseAnonKey:key})+';');if(!fs.existsSync('config.js'))throw new Error('Configure as variáveis do Supabase ou adicione config.js.');"
          mkdir dist
          cp index.html app.js uploads.js style.css auth.css uploads.css config.js dist/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
